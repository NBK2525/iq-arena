<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="空間・計算・記憶・注意・推理。5つの頭脳ステージを通しでクリアして、合計タイムを競うブラウザゲーム。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IQ ARENA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one arena page — title screen, then per stage: rule intro → play (board left, scoreboard rail right) → final results */
:root{
  --bg:#E8ECF2; --surface:#F7F9FC; --board:#FFFFFF; --ink:#141B2B; --muted:#5B6680;
  --line:#D2D9E5; --accent:#2F55E0; --accent-soft:rgba(47,85,224,.13);
  --goal:#C97A10; --bad:#C8323C; --good:#1E8657;
  --felt:#1F5A49; --felt-edge:#174536; --card:#FFFFFF; --card-ink:#141B2B; --card-red:#C8323C;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --surface:#141A25; --board:#19202E; --ink:#E6EBF4; --muted:#93A0B8;
  --line:#2A3345; --accent:#7D95FF; --accent-soft:rgba(125,149,255,.17);
  --goal:#F0A53A; --bad:#FF6B74; --good:#4CC28A;
  --felt:#163D33; --felt-edge:#0F2B24; --card:#F3F5F9; --card-ink:#141B2B; --card-red:#C8323C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1119; --surface:#141A25; --board:#19202E; --ink:#E6EBF4; --muted:#93A0B8;
  --line:#2A3345; --accent:#7D95FF; --accent-soft:rgba(125,149,255,.17);
  --goal:#F0A53A; --bad:#FF6B74; --good:#4CC28A;
  --felt:#163D33; --felt-edge:#0F2B24; --card:#F3F5F9; --card-ink:#141B2B; --card-red:#C8323C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダーとステージ進行 */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,32px);letter-spacing:.06em;margin:0;line-height:1}
.logo span{color:var(--accent)}
.track{display:flex;gap:6px;flex-wrap:wrap}
.track .st{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.track .st i{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--f-display);font-style:normal;background:var(--line);color:var(--muted)}
.track .st.now{border-color:var(--accent);color:var(--ink)}
.track .st.now i{background:var(--accent);color:#fff}
.track .st.done i{background:var(--good);color:#fff}
.track .st.pass i{background:var(--bad);color:#fff}
.diffchip{font:700 12px var(--f-display);letter-spacing:.1em;padding:5px 10px;border-radius:6px;background:var(--ink);color:var(--board)}
@media (max-width:640px){.track .st .nm{display:none}.track .st{padding:4px}}

/* 共通部品 */
.panelcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px)}
.btn{font:700 14px var(--f-body);border:1px solid var(--line);background:var(--board);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{font-size:17px;padding:14px 28px}
.btn:disabled{opacity:.45;cursor:default}
.k{font:600 11px var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;background:var(--board);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{font:700 15px var(--f-body);border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--board)}

/* タイトル画面 */
.title h1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,10vw,84px);letter-spacing:.05em;margin:0;line-height:1}
.title h1 span{color:var(--accent)}
.title .lead{color:var(--muted);margin:10px 0 24px;max-width:46ch}
.stagelist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:26px}
@media (max-width:760px){.stagelist{grid-template-columns:minmax(0,1fr)}}
.stagelist div{background:var(--board);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stagelist b{display:block;font:700 12px var(--f-display);letter-spacing:.12em;color:var(--accent)}
.stagelist strong{display:block;font-size:15px;margin:2px 0}
.stagelist small{color:var(--muted)}
.titlerow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.titlerow .grp{display:flex;flex-direction:column;gap:6px}
.diffnote{color:var(--muted);font-size:13px;margin-top:10px;min-height:1.6em}
.codebox{display:flex;gap:6px;margin-top:18px;max-width:420px}
.codebox input{flex:1;min-width:0;font:600 14px var(--f-display);letter-spacing:.04em;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--board);color:var(--ink)}

/* ルール紹介 */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,4vw,36px);align-items:center}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.intro .eyebrow{font:700 12px var(--f-display);letter-spacing:.16em;color:var(--muted)}
.intro h2{font:700 clamp(28px,5vw,40px)/1.15 var(--f-body);margin:6px 0 4px;text-wrap:balance}
.intro .skill{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid transparent;color:var(--muted);transition:background .25s,color .25s,border-color .25s;cursor:pointer}
.steps li i{font:700 13px var(--f-display);font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.steps li.on{background:var(--board);border-color:var(--accent);color:var(--ink)}
.steps li.on i{background:var(--accent);color:#fff}
.steps li.seen{color:var(--ink)}
.ill{background:var(--board);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:260px}
.ill svg{width:100%;max-width:300px;height:auto;display:block}
.ill .anim{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.introbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.introbar .prog{flex:1;min-width:120px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.introbar .prog i{display:block;height:100%;background:var(--accent);width:0}

/* プレイ画面 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
@media (max-width:800px){.main{grid-template-columns:minmax(0,1fr)}}
.stagecol{display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.phase{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-height:52px}
.phase .p{font:700 clamp(15px,2.8vw,19px) var(--f-body)}
.phase .p.look{color:var(--accent)}.phase .p.find{color:var(--goal)}.phase .p.ok{color:var(--good)}.phase .p.ng{color:var(--bad)}
.phase .tbar{flex:1;max-width:200px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.phase .tbar i{display:block;height:100%;width:100%;background:var(--accent)}
.phase .nextbox{display:flex;align-items:baseline;gap:8px}
.phase .nextbox b{font:700 clamp(26px,5vw,34px)/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.flashbad{animation:fb .35s}
@keyframes fb{30%{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}}
.boardbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(10px,2.5vw,22px);display:flex;justify-content:center}
.boardbox svg.board{width:100%;max-width:520px;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);border-radius:12px;text-align:center;padding:20px;z-index:3}
.overlay .big{font:700 clamp(56px,14vw,110px)/1 var(--f-display);color:var(--accent)}
.overlay .label{font:700 clamp(22px,4vw,30px) var(--f-display);letter-spacing:.06em}
.overlay .sub{color:var(--muted);max-width:36ch}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .v{font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:22px}
.full{grid-column:1/-1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.msg{grid-column:1/-1;min-height:1.6em;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn.wide{grid-column:1/-1}
.btn.pass{color:var(--muted);font-weight:400;font-size:13px}
.keys{font-size:12px;color:var(--muted);margin:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.ng{background:var(--bad);border-color:var(--bad)}

/* ステージ2：カードテーブル */
.table{position:relative;background:var(--felt);border:6px solid var(--felt-edge);border-radius:16px;padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:clamp(12px,2.6vw,20px)}
.target{text-align:center;color:#E9F2EE;font:700 clamp(15px,2.4vw,18px) var(--f-body)}
.target b{font:700 2em var(--f-display);color:#FFD27A;letter-spacing:.04em;margin:0 .15em}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:500px;width:100%;margin:0 auto}
.card{aspect-ratio:5/7;max-width:100%;background:var(--card);color:var(--card-ink);border:0;border-radius:10px;cursor:pointer;position:relative;padding:0;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);transition:transform .12s,opacity .12s;font-family:var(--f-display)}
.card.red{color:var(--card-red)}
.card .corner{position:absolute;top:6%;left:9%;display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:clamp(13px,2.6vw,20px)}
.card .corner.br{top:auto;left:auto;bottom:6%;right:9%;transform:rotate(180deg)}
.card .corner small{font-size:.85em}
.card .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(30px,7vw,52px)}
.card.used{opacity:.25;transform:scale(.94);cursor:default;box-shadow:none}
.ops{display:flex;justify-content:center;gap:clamp(8px,2vw,14px);flex-wrap:wrap}
.op{width:clamp(50px,11vw,60px);height:clamp(50px,11vw,60px);border-radius:50%;border:2px solid rgba(233,242,238,.5);background:rgba(0,0,0,.18);color:#E9F2EE;font:700 clamp(24px,5vw,28px) var(--f-display);cursor:pointer}
.op:hover:not(:disabled){background:rgba(0,0,0,.32)}
.op:disabled{opacity:.35;cursor:default}
.expr-row{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,10px);flex-wrap:wrap;min-height:64px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px}
.tok{min-width:clamp(38px,8.5vw,50px);height:clamp(46px,10vw,56px);display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font:700 clamp(22px,5vw,28px) var(--f-display);border:0;cursor:pointer;padding:0 6px}
.tok.c{background:var(--card);color:var(--card-ink)}
.tok.c.red{color:var(--card-red)}
.tok.o{background:transparent;color:#FFD27A;min-width:clamp(22px,5vw,30px)}
.tok.empty{background:transparent;border:2px dashed rgba(233,242,238,.3);cursor:default}
.tok.empty.o{border-radius:50%;min-width:clamp(26px,6vw,34px);height:clamp(26px,6vw,34px)}
.tok.next{border-color:#FFD27A}
.eq,.res{color:#E9F2EE;font:700 clamp(22px,5vw,28px) var(--f-display);font-variant-numeric:tabular-nums}
.res{min-width:2.5ch}.res.ok{color:#9BEBC0}.res.ng{color:#FFB0B5}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ステージ5：選択肢 */
.boardbox svg.board.mx{max-width:380px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px;width:100%;margin:0 auto}
.opt{background:var(--board);border:2px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;aspect-ratio:1;max-width:100%;position:relative}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt svg{width:100%;height:100%;display:block}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad);opacity:.7}
.opt .lab{position:absolute;top:3px;left:6px;font:700 11px var(--f-display);color:var(--muted)}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;min-height:46px}
.explain ul{margin:0;padding-left:1.2em}

/* 結果画面 */
.result .total{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin:8px 0 22px}
.result .total b{font:700 clamp(44px,10vw,84px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.result .total span{color:var(--muted)}
.result h2{font:700 clamp(26px,5vw,36px) var(--f-display);letter-spacing:.06em;margin:0}
.restable{overflow-x:auto}
.restable table{width:100%;border-collapse:collapse;min-width:520px}
.restable th,.restable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.restable th{font:600 11px var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.restable td.t{font:700 18px var(--f-display);text-align:right}
.restable th.t{text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.ng{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.restable tfoot td{border-bottom:0;font-weight:700}
.resrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.resrow .code{font:600 13px var(--f-display);color:var(--muted)}

/* ランキング */
.rank{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.rank h3{font:700 18px var(--f-body);margin:0 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rank .seg button{font-size:13px;padding:6px 12px}
.rank ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rank li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--board);border:1px solid var(--line)}
.rank li.me{border-color:var(--accent);background:var(--accent-soft)}
.rank li.gap{background:transparent;border:0;padding:0 12px;color:var(--muted);display:block;text-align:center}
.rank .rk{font:700 16px var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.rank li:nth-child(-n+3) .rk{color:var(--goal)}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .nm small{font-weight:400;color:var(--accent);margin-left:6px}
.rank .tm{font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.rank .empty{color:var(--muted);font-size:14px;padding:6px 0}
.submit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;background:var(--board);border:1px solid var(--line);border-radius:12px;padding:14px}
.submit input{flex:1;min-width:140px;font:700 15px var(--f-body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.submit .st{flex-basis:100%;font-size:14px;color:var(--muted);min-height:1.4em}
.submit .st.ok{color:var(--good);font-weight:700}.submit .st.ng{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="config.js"></script>
</head>
<body>


<div class="wrap">
  <header id="hdr" hidden>
    <div class="logo">IQ <span>ARENA</span></div>
    <div class="track" id="track"></div>
    <span class="diffchip" id="diffChip"></span>
  </header>

  <!-- タイトル -->
  <section class="panelcard title" id="scrTitle">
    <h1>IQ <span>ARENA</span></h1>
    <p class="lead">5つの頭脳ステージを順番にクリアせよ。空間・計算・記憶・注意・推理、すべてを使う。合計タイムが短いほど上位。</p>
    <div class="stagelist" id="stageList"></div>
    <div class="titlerow">
      <div class="grp"><span class="k">難易度（全ステージ共通）</span><div class="seg" id="diffSeg" role="group" aria-label="難易度"></div></div>
      <button class="btn primary big" id="startBtn">ゲームを始める</button>
    </div>
    <div class="diffnote" id="diffNote"></div>
    <div class="codebox">
      <input id="codeIn" aria-label="問題コード" placeholder="問題コード（例 IQ-N-1A2B3C）" spellcheck="false">
      <button class="btn" id="codeBtn">このコードで始める</button>
    </div>
    <div class="diffnote" id="codeMsg"></div>
    <div class="rank" id="titleRank" hidden>
      <h3>ランキング <span class="seg" id="rankSeg" role="group" aria-label="ランキングの難易度"></span></h3>
      <ol id="titleRankList"></ol>
    </div>
  </section>

  <!-- ルール紹介 -->
  <section class="panelcard" id="scrIntro" hidden>
    <div class="intro">
      <div>
        <div class="eyebrow" id="inStage">STAGE 1 / 5</div>
        <h2 id="inName"></h2>
        <span class="skill" id="inSkill"></span>
        <ol class="steps" id="inSteps"></ol>
      </div>
      <div class="ill" id="inIll"></div>
    </div>
    <div class="introbar">
      <button class="btn" id="replayBtn">ルールをもう一度</button>
      <span class="prog"><i id="inProg"></i></span>
      <button class="btn primary big" id="goBtn">スタート</button>
    </div>
  </section>

  <!-- プレイ -->
  <section class="main" id="scrPlay" hidden>
    <div class="stagecol">
      <div class="phase" id="phase"></div>
      <div id="stageBody"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="rail">
      <div class="score">
        <div class="stat"><div class="k">合計タイム</div><div class="v" id="tTotal">0.0</div></div>

<script>
/* ===== 各ステージの問題生成・検証ライブラリ（試作品から流用） ===== */
const LIB1=function(){
  function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function nbrs(n,c){const r=(c/n)|0,k=c%n,o=[];if(r>0)o.push(c-n);if(k<n-1)o.push(c+1);if(r<n-1)o.push(c+n);if(k>0)o.push(c-1);return o;}
  function dirBit(n,a,b){return b===a-n?1:b===a+1?2:b===a+n?4:b===a-1?8:0;}
  function blocked(walls,n,a,b){return (walls[a]&dirBit(n,a,b))!==0;}
  function setWall(walls,n,a,b){walls[a]|=dirBit(n,a,b);walls[b]|=dirBit(n,b,a);}
  function ek(a,b){return a<b?a*4096+b:b*4096+a;}

  // 全マスを1回ずつ通るランダムなルート（backbite法）
  function hamPath(n,R){
    const L=n*n,p=[];for(let r=0;r<n;r++)for(let k=0;k<n;k++)p.push(r*n+(r%2?n-1-k:k));
    const pos=new Int32Array(L);const re=()=>{for(let i=0;i<L;i++)pos[p[i]]=i;};re();
    const iters=L*120;
    for(let it=0;it<iters;it++){
      if(R()<0.5){p.reverse();re();}
      const end=p[L-1],ns=nbrs(n,end),x=ns[(R()*ns.length)|0];
      const i=pos[x];if(i===L-2)continue;
      let a=i+1,b=L-1;while(a<b){const t=p[a];p[a]=p[b];p[b]=t;pos[p[a]]=a;pos[p[b]]=b;a++;b--;}
    }

  // 正解ルート上の数字位置（1=先頭、N=末尾、中間は散らす）
  function placeIdx(L,N,R){
    const seg=(L-1)/(N-1),idx=[0];
    for(let k=1;k<N-1;k++){let p=Math.round(k*seg+(R()-0.5)*seg*0.7);p=Math.max(idx[k-1]+2,Math.min(L-2-(N-1-k)*2,p));idx.push(p);}
    idx.push(L-1);return idx;
  }
  // 独立した正解判定
  function validate(P,route){
    const {n,N,numAt,walls}=P,L=n*n;
    if(route.length!==L)return{ok:false,reason:"すべてのマスを通過していません"};
    if(numAt[route[0]]!==1)return{ok:false,reason:"1 から始まっていません"};
    const seen=new Uint8Array(L);let next=1;
    for(let i=0;i<L;i++){const c=route[i];

      if(i>0){const p=route[i-1];if(!dirBit(n,p,c))return{ok:false,reason:"隣接していない移動があります"};if(blocked(walls,n,p,c))return{ok:false,reason:"壁を越えています"};}
      const v=numAt[c];if(v){if(v!==next)return{ok:false,reason:"数字の順番が違います"};next++;}
    }
    if(numAt[route[L-1]]!==N)return{ok:false,reason:"最後が "+N+" ではありません"};
    return{ok:true};
  }
  // 解を探索（limit 件まで、maxNodes で打ち切り）
  function solve(P,limit,maxNodes){
    const {n,N,numAt,walls}=P,L=n*n,adj=[];
    for(let c=0;c<L;c++)adj.push(nbrs(n,c).filter(b=>!blocked(walls,n,c,b)));
    const start=numAt.indexOf(1),goal=numAt.indexOf(N);
    const vis=new Uint8Array(L),path=[start];vis[start]=1;
    const mark=new Int32Array(L);let stamp=0,nodes=0,count=0,aborted=false;const sols=[];const stack=new Int32Array(L);
    function prune(cur){
      const remain=L-path.length;
      for(let c=0;c<L;c++){if(vis[c])continue;let d=0;for(const b of adj[c])if(!vis[b]||b===cur)d++;if(d<(c===goal?1:2))return true;}
      stamp++;let sp=0,got=0;
      for(const b of adj[cur])if(!vis[b]&&mark[b]!==stamp){mark[b]=stamp;stack[sp++]=b;}
      while(sp){const c=stack[--sp];got++;for(const b of adj[c])if(!vis[b]&&mark[b]!==stamp){mark[b]=stamp;stack[sp++]=b;}}
      return got!==remain;
    }
    function dfs(cur,next){
      if(aborted||count>=limit)return;
      if(++nodes>maxNodes){aborted=true;return;}
      if(path.length===L){count++;sols.push(path.slice());return;}
      for(const nb of adj[cur]){
        if(vis[nb])continue;const v=numAt[nb];
        if(v){if(v!==next)continue;if(v===N&&path.length!==L-1)continue;}
        vis[nb]=1;path.push(nb);
        if(path.length===L||!prune(nb))dfs(nb,v?next+1:next);
        path.pop();vis[nb]=0;
        if(aborted||count>=limit)return;
      }
    }
    dfs(start,2);
    return{count,sols,nodes,aborted};
  }
  function makePuzzle(o){
    const {n,diff,seed}=o,R=rng(seed),L=n*n,N=n,t0=Date.now();
    for(let attempt=0;attempt<40;attempt++){
      const path=hamPath(n,R),idx=placeIdx(L,N,R);
      const numAt=new Array(L).fill(0);idx.forEach((p,k)=>numAt[path[p]]=k+1);
      const walls=new Array(L).fill(0),P={n,N,numAt,walls};
      const onPath=new Set();for(let i=0;i<L-1;i++)onPath.add(ek(path[i],path[i+1]));
      const cand=[];for(let c=0;c<L;c++){if(c%n<n-1&&!onPath.has(ek(c,c+1)))cand.push([c,c+1]);if(c+n<L&&!onPath.has(ek(c,c+n)))cand.push([c,c+n]);}
      for(let i=cand.length-1;i>0;i--){const j=(R()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
      const free=()=>cand.filter(([a,b])=>!blocked(walls,n,a,b));

      let unique=false;
      for(let loop=0;loop<120;loop++){
        const r=solve(P,2,300000);
        if(r.aborted){const f=free();for(let k=0;k<3&&k<f.length;k++)setWall(walls,n,f[k][0],f[k][1]);continue;}
        if(r.count===1){unique=true;break;}
        if(r.count===0)break;
        const alt=r.sols.find(s=>s.some((c,i)=>c!==path[i]));if(!alt)break;
        const opts=[];for(let i=0;i<L-1;i++){const a=alt[i],b=alt[i+1];if(!onPath.has(ek(a,b))&&!blocked(walls,n,a,b))opts.push([a,b]);}
        if(!opts.length)break;const [a,b]=opts[(R()*opts.length)|0];setWall(walls,n,a,b);
      }
      if(!unique)continue;
      const frac={easy:0.32,normal:0.14,hard:0}[diff]||0;
      const f=free(),extra=Math.round(f.length*frac);
      for(let k=0;k<extra;k++)setWall(walls,n,f[k][0],f[k][1]);
      const fin=solve(P,2,3000000);
      if(fin.aborted||fin.count!==1)continue;
      if(!validate(P,path).ok)continue;
      let wallCount=0;for(let c=0;c<L;c++){if(walls[c]&2)wallCount++;if(walls[c]&4)wallCount++;}
      return{n,N,numAt,walls,solution:path,stats:{unique:true,nodes:fin.nodes,walls:wallCount,ms:Date.now()-t0,attempts:attempt+1}};
    }
    return{error:"生成に失敗しました"};
  }
  return{makePuzzle,validate,solve,nbrs,dirBit,blocked};
};
const LIB2=function(){
  function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
  function Q(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d;}const g=gcd(n,d);return{n:n/g,d:d/g};}
  function ap(a,o,b){if(o==="+")return Q(a.n*b.d+b.n*a.d,a.d*b.d);if(o==="-")return Q(a.n*b.d-b.n*a.d,a.d*b.d);if(o==="*")return Q(a.n*b.n,a.d*b.d);return b.n===0?null:Q(a.n*b.d,a.d*b.n);}
  // カッコなし・×÷優先で計算（分数のまま正確に）
  function evaluate(nums,ops){const terms=[Q(nums[0])],add=[];
    for(let i=0;i<ops.length;i++){const o=ops[i],b=Q(nums[i+1]);if(o==="*"||o==="/"){const v=ap(terms[terms.length-1],o,b);if(!v)return null;terms[terms.length-1]=v;}else{add.push(o);terms.push(b);}}
    let v=terms[0];for(let i=0;i<add.length;i++)v=ap(v,add[i],terms[i+1]);return v;}
  const SYM={"+":"+","-":"−","*":"×","/":"÷"},OPS=["+","-","*","/"],P3=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  // 4枚から3枚を選んで作れる整数と、その作り方
  function allTargets(vals){const m=new Map();
    for(let skip=0;skip<4;skip++){const idx=[0,1,2,3].filter(i=>i!==skip),seen=new Set();
      for(const p of P3){const ii=p.map(k=>idx[k]),nums=ii.map(i=>vals[i]),key=nums.join(",");if(seen.has(key))continue;seen.add(key);
        for(const a of OPS)for(const b of OPS){const v=evaluate(nums,[a,b]);if(!v||v.d!==1)continue;if(!m.has(v.n))m.set(v.n,[]);m.get(v.n).push({nums,ops:[a,b]});}}}
    return m;}
  const show=s=>s.nums.map((n,i)=>i?` ${SYM[s.ops[i-1]]} ${n}`:String(n)).join("");
  const LEVEL={easy:{lo:10,hi:30,min:8,max:999},normal:{lo:10,hi:40,min:4,max:7},hard:{lo:10,hi:50,min:1,max:3}};
  function makeQuestion(R,diff){const Lv=LEVEL[diff];
    for(let tries=0;tries<400;tries++){
      const deck=[];for(let s=0;s<4;s++)for(let r=1;r<=10;r++)deck.push({r,s});
      const hand=[];for(let k=0;k<4;k++)hand.push(deck.splice((R()*deck.length)|0,1)[0]);
      const m=allTargets(hand.map(c=>c.r));
      const pool=[...m].filter(([v,sols])=>v>=Lv.lo&&v<=Lv.hi&&sols.length>=Lv.min&&sols.length<=Lv.max);
      if(!pool.length)continue;const [goal,sols]=pool[(R()*pool.length)|0];
      return{hand,goal,count:sols.length,answer:show(sols[0])};}
    return null;}
  function makeStage(o){const R=rng(o.seed),qs=[],used=new Set();
    while(qs.length<o.count){const q=makeQuestion(R,o.diff);if(!q)return{error:"生成に失敗しました"};const k=q.hand.map(c=>c.r).sort().join()+":"+q.goal;if(used.has(k))continue;used.add(k);qs.push(q);}
    return{questions:qs};}
  // 独立した正解判定：異なる3枚・記号2つで目標になるか
  function validate(q,used,ops){
    if(used.length!==3||ops.length!==2)return{ok:false,reason:"カードを3枚使ってください"};
    if(new Set(used).size!==3||used.some(i=>i<0||i>3))return{ok:false,reason:"同じカードは2回使えません"};
    const v=evaluate(used.map(i=>q.hand[i].r),ops);if(!v)return{ok:false,reason:"0 で割ることはできません"};
    if(v.d!==1||v.n!==q.goal)return{ok:false,reason:"目標の数になっていません",v};return{ok:true,v};}
  return{makeStage,validate,evaluate,allTargets,SYM,Q};
};
const LIB3=function(){
  function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  const SHAPES=3,COLORS=3;
  const DIFF={
    easy:  {n:4,items:4,look:4000,types:["remove","add","move"]},
    normal:{n:4,items:5,look:3500,types:["remove","add","move","color"]},
    hard:  {n:4,items:7,look:3000,types:["remove","add","move","color","shape","swap"]}
  };
  const same=(a,b)=>a===b||(a&&b&&a.shape===b.shape&&a.color===b.color);
  function diffCells(a,b){const d=[];for(let i=0;i<a.length;i++)if(!same(a[i],b[i]))d.push(i);return d;}
  function makeQuestion(R,diff){
    const D=DIFF[diff],L=D.n*D.n,pick=a=>a[(R()*a.length)|0];
    for(;;){
      const before=new Array(L).fill(null),cells=[...Array(L).keys()];
      for(let i=cells.length-1;i>0;i--){const j=(R()*(i+1))|0;[cells[i],cells[j]]=[cells[j],cells[i]];}
      cells.slice(0,D.items).forEach(c=>before[c]={shape:(R()*SHAPES)|0,color:(R()*COLORS)|0});
      const after=before.map(x=>x&&{...x}),full=[],empty=[];
      before.forEach((x,i)=>(x?full:empty).push(i));
      const type=pick(D.types);let answer;
      if(type==="remove"){const c=pick(full);after[c]=null;answer=[c];}
      else if(type==="add"){const c=pick(empty);after[c]={shape:(R()*SHAPES)|0,color:(R()*COLORS)|0};answer=[c];}
      else if(type==="color"){const c=pick(full);after[c].color=(after[c].color+1+((R()*(COLORS-1))|0))%COLORS;answer=[c];}
      else if(type==="shape"){const c=pick(full);after[c].shape=(after[c].shape+1+((R()*(SHAPES-1))|0))%SHAPES;answer=[c];}
      else if(type==="move"){const a=pick(full),b=pick(empty);after[b]=after[a];after[a]=null;answer=[a,b];}
      else{const a=pick(full),bs=full.filter(c=>!same(before[c],before[a]));if(!bs.length)continue;const b=pick(bs);[after[a],after[b]]=[after[b],after[a]];answer=[a,b];}
      // 検証：変化したマスが正解マスとちょうど一致すること
      const d=diffCells(before,after);
      if(d.length!==answer.length||!answer.every(c=>d.includes(c)))continue;
      return{n:D.n,look:D.look,type,before,after,answer};
    }
  }
  function makeStage(o){const R=rng(o.seed),qs=[];for(let i=0;i<o.max;i++)qs.push(makeQuestion(R,o.diff));return{questions:qs};}
  // 独立した正解判定：before と after を比べて変化したマスか
  function validate(q,cell){return diffCells(q.before,q.after).includes(cell);}
  return{makeStage,validate,diffCells,DIFF};
};
const LIB4=function(){
  function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  const DIFF={easy:{n:4,fade:true,noise:false},normal:{n:5,fade:true,noise:false},hard:{n:5,fade:false,noise:true}};
  function makeStage(o){
    const R=rng(o.seed),D=DIFF[o.diff],L=D.n*D.n;
    for(;;){
      const nums=[...Array(L)].map((_,i)=>i+1);
      for(let i=L-1;i>0;i--){const j=(R()*(i+1))|0;[nums[i],nums[j]]=[nums[j],nums[i]];}
      // 隣り合う数字が上下左右に並びすぎる配置は除外（連番が見つけやすすぎるため）
      const pos=[];nums.forEach((v,c)=>pos[v]=c);let adj=0;
      for(let v=1;v<L;v++){const a=pos[v],b=pos[v+1];if(Math.abs(a-b)===D.n||(Math.abs(a-b)===1&&((a/D.n)|0)===((b/D.n)|0)))adj++;}

  function validate(P,taps){const L=P.n*P.n;if(taps.length!==L)return false;return taps.every((c,i)=>P.nums[c]===i+1);}

};
const LIB5=function(){

  // 1つの属性の 3×3 の値を作る

      const options=[];for(let m=0;m<8;m++){const o={...answer};optAttrs.forEach((a,i)=>{if(m>>i&1)o[a]=alt[a];});options.push(o);}
      for(let i=7;i>0;i--){const j=(R()*(i+1))|0;[options[i],options[j]]=[options[j],options[i]];}
      const correct=options.findIndex(o=>ATTRS.every(a=>o[a]===answer[a]));

  $("diffChip").textContent=DIFF_JA[game.diff];}
function refreshActions(){if(!cur)return;const box=$("actions");const acts=cur.actions();
  box.innerHTML="";acts.forEach(([l,fn,en])=>{const b=document.createElement("button");b.className="btn";b.textContent=l;b.disabled=!game.running||!en();b.onclick=fn;box.appendChild(b);});
  const p=document.createElement("button");p.className="btn pass wide";p.id="passBtn";p.textContent=`このステージをパス（+${PASS_PENALTY}秒）`;p.disabled=!game.running;p.onclick=()=>armPass(p);box.appendChild(p);
  $("keys").textContent=cur.keys?"キーボード："+cur.keys:"";}
let passArmed=false;
function armPass(b){if(!game.running)return;if(!passArmed){passArmed=true;b.textContent="もう一度押すとパス";b.classList.add("primary");setTimeout(()=>{passArmed=false;if(b.isConnected){b.textContent=`このステージをパス（+${PASS_PENALTY}秒）`;b.classList.remove("primary");}},2500);return;}passArmed=false;passStage();}

/* ===== タイトル ===== */
$("stageList").innerHTML=STAGES.map((s,i)=>`<div><b>STAGE ${i+1}</b><strong>${s.name}</strong><small>${s.skill}</small></div>`).join("");
function drawDiff(){const el=$("diffSeg");el.innerHTML="";DIFFS.forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed",String(game.diff===v));b.onclick=()=>{game.diff=v;drawDiff();};el.appendChild(b);});
  const best=parseFloat(store(`iqa-total-${game.diff}`));$("diffNote").textContent=DIFF_NOTE[game.diff]+(isNaN(best)?"":`　自己ベスト ${fmtL(best)}`);}
drawDiff();
const codeOf=()=>`IQ-${DL[game.diff]}-${(game.seed>>>0).toString(36).toUpperCase()}`;
function startGame(seed){game.seed=seed!==undefined?seed:(Math.random()*4294967296)>>>0;game.idx=0;game.results=[];beginStage();}
$("startBtn").onclick=()=>startGame();
$("codeBtn").onclick=()=>{const m=$("codeIn").value.trim().toUpperCase().match(/^IQ-([ENH])-([0-9A-Z]+)$/);
  if(!m){$("codeMsg").textContent="コードの形式は IQ-N-1A2B3C です";return;}game.diff={E:"easy",N:"normal",H:"hard"}[m[1]];drawDiff();startGame(parseInt(m[2],36)>>>0);};

/* ===== ルール紹介 ===== */
let introStep=0,prepared=null;
const STEP_MS=2600;
function beginStage(){
  clearLater();cur=STAGES[game.idx];game.running=false;drawTrack();show("scrIntro");
  $("inStage").textContent=`STAGE ${game.idx+1} / 5`;$("inName").textContent=cur.name;$("inSkill").textContent=`使う力：${cur.skill}`;
  $("inSteps").innerHTML=cur.steps.map((s,i)=>`<li data-i="${i}"><i>${i+1}</i><span>${s.t}</span></li>`).join("");
  [...$("inSteps").children].forEach(li=>li.onclick=()=>playIntro(+li.dataset.i,false));
  prepared=null;const btn=$("goBtn");btn.disabled=true;btn.textContent="問題を準備中…";
  const myIdx=game.idx;
  cur.prepare(game.diff,stageSeed(game.seed,game.idx)).then(r=>{if(game.idx!==myIdx)return;
    if(!r||r.error){btn.textContent="生成に失敗。もう一度";btn.disabled=false;btn.onclick=beginStage;return;}
    prepared=r;btn.disabled=false;btn.textContent=game.idx===0?"スタート":`STAGE ${game.idx+1} スタート`;btn.onclick=goPlay;});
  playIntro(0,true);
}
function playIntro(i,auto){clearTimeout(introTimer);introStep=i;
  [...$("inSteps").children].forEach((li,k)=>{li.classList.toggle("on",k===i);li.classList.toggle("seen",k<i);});
  $("inIll").innerHTML=`<div class="anim" style="width:100%;display:flex;justify-content:center">${cur.ill(i)}</div>`;
  const pr=$("inProg");pr.style.transition="none";pr.style.width=(100*i/cur.steps.length)+"%";
  if(!auto)return;
  void pr.offsetWidth;pr.style.transition=`width ${STEP_MS}ms linear`;pr.style.width=(100*(i+1)/cur.steps.length)+"%";
  if(i+1<cur.steps.length)introTimer=setTimeout(()=>playIntro(i+1,true),STEP_MS);
  else introTimer=setTimeout(()=>{[...$("inSteps").children].forEach(li=>li.classList.add("seen"));},STEP_MS);
}
$("replayBtn").onclick=()=>playIntro(0,true);

/* ===== プレイ ===== */
function goPlay(){if(!prepared)return;clearTimeout(introTimer);show("scrPlay");drawTrack();
  cur.mount(prepared);setPhase(`<span class="p">STAGE ${game.idx+1}　${cur.name}</span>`);setMsg("");
  const ov=$("overlay");let c=3;
  const step=()=>{if(c===0){ov.hidden=true;game.running=true;game.stageStart=performance.now();startTick();cur.start();refreshActions();return;}
    ov.innerHTML=`<div class="big">${c}</div><div class="sub">STAGE ${game.idx+1}　${cur.name}</div>`;ov.hidden=false;c--;later(step,650);};
  step();refreshActions();drawTimes();}
const doneTime=()=>game.results.reduce((a,r)=>a+r.time,0);
function stageElapsed(){return game.running?(performance.now()-game.stageStart)/1000:0;}
function drawTimes(){const s=stageElapsed();$("tStage").textContent=fmtT(s);$("tTotal").textContent=fmtT(doneTime()+s);}
function startTick(){stopTick();tick=setInterval(drawTimes,100);}
function stopTick(){if(tick)clearInterval(tick);tick=null;}
function stageClear(summary){if(!game.running)return;const t=stageElapsed();game.running=false;stopTick();clearLater();
  game.results[game.idx]={time:t,summary,pass:false};drawTimes();drawTrack();refreshActions();
  const ov=$("overlay");ov.innerHTML=`<div class="label">STAGE ${game.idx+1} CLEAR</div><div class="big" style="font-size:clamp(40px,9vw,64px)">${t.toFixed(1)}<span style="font-size:.45em"> 秒</span></div><div class="sub">${summary}</div>`;ov.hidden=false;
  later(nextStage,1600);}
function passStage(){if(!game.running)return;const t=stageElapsed();game.running=false;stopTick();clearLater();
  game.results[game.idx]={time:t+PASS_PENALTY,raw:t,summary:"パス",pass:true};drawTimes();drawTrack();refreshActions();
  const ov=$("overlay");ov.innerHTML=`<div class="label">PASS</div><div class="sub">${t.toFixed(1)} 秒 ＋ ペナルティ ${PASS_PENALTY} 秒</div>`;ov.hidden=false;
  later(nextStage,1400);}
function nextStage(){$("overlay").hidden=true;game.idx++;if(game.idx>=STAGES.length){finish();return;}beginStage();}

/* ===== 結果 ===== */
function finish(){cur=null;drawTrack();show("scrResult");
  const total=doneTime(),passes=game.results.filter(r=>r.pass).length,allClear=passes===0;
  $("resTitle").textContent=allClear?"ALL STAGES CLEAR":"FINISH";
  $("resTotal").textContent=fmtL(total);$("resFoot").textContent=fmtL(total);
  let bestTxt="";if(allClear){const key=`iqa-total-${game.diff}`,prev=parseFloat(store(key));if(!(prev<=total)){store(key,total.toFixed(1));bestTxt="自己ベスト更新！";}else bestTxt=`自己ベスト ${fmtL(prev)}`;}
  else bestTxt=`パス ${passes} 回（パスがあると自己ベストは記録されません）`;
  $("resBest").textContent=`${DIFF_JA[game.diff]}　${bestTxt}`;
  $("resBody").innerHTML=STAGES.map((s,i)=>{const r=game.results[i];
    return`<tr><td>STAGE ${i+1}</td><td>${s.name}<br><small style="color:var(--muted)">${s.skill}</small></td><td>${r.pass?`${r.raw.toFixed(1)} 秒 ＋ ${PASS_PENALTY}`:r.summary}</td><td><span class="pill ${r.pass?"ng":"ok"}">${r.pass?"パス":"クリア"}</span></td><td class="t">${fmtL(r.time)}</td></tr>`;}).join("");
  $("resCode").textContent=`問題コード ${codeOf()}`;setupSubmit(allClear);}
$("againNew").onclick=()=>startGame();
$("againSame").onclick=()=>startGame(game.seed);
$("toTitle").onclick=()=>{drawDiff();show("scrTitle");showTitleRank();};


/* ===== ランキング（Supabase） ===== */
const RCFG=window.IQA_CONFIG||{};
const RANK_ON=!!(RCFG.supabaseUrl&&RCFG.supabaseAnonKey);
function playerId(){let id=store("iqa-player");if(!id){id=(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,()=>(Math.random()*16|0).toString(16)));store("iqa-player",id);}return id;}
async function rpc(fn,body){
  const r=await fetch(`${RCFG.supabaseUrl.replace(/\/$/,"")}/rest/v1/rpc/${fn}`,{method:"POST",
    headers:Object.assign({"Content-Type":"application/json",apikey:RCFG.supabaseAnonKey},/^eyJ/.test(RCFG.supabaseAnonKey)?{Authorization:`Bearer ${RCFG.supabaseAnonKey}`}:{}),body:JSON.stringify(body)});
  const txt=await r.text();let data=null;try{data=JSON.parse(txt);}catch(e){}
  if(!r.ok){const e=new Error((data&&data.message)||txt||String(r.status));e.code=data&&data.message;throw e;}
  return data;}
const SUBMIT_ERR={nickname_length:"ニックネームは1〜12文字で入力してください",too_frequent:"続けて登録できません。20秒ほど待ってから登録してください",stage_time_invalid:"記録が正しくないため登録できませんでした"};
function drawRank(listEl,rows){listEl.innerHTML="";
  if(!rows.length){const li=document.createElement("div");li.className="empty";li.textContent="まだ記録がありません。最初の1人になろう。";listEl.appendChild(li);return;}
  let prevRank=0;
  rows.forEach(r=>{
    if(prevRank&&r.rank>prevRank+1&&r.is_me){const g=document.createElement("li");g.className="gap";g.textContent="⋮";listEl.appendChild(g);}
    prevRank=r.rank;
    const li=document.createElement("li");if(r.is_me)li.className="me";
    const rk=document.createElement("span");rk.className="rk";rk.textContent=r.rank+"位";
    const nm=document.createElement("span");nm.className="nm";nm.textContent=r.nickname;if(r.is_me){const y=document.createElement("small");y.textContent="あなた";nm.appendChild(y);}
    const tm=document.createElement("span");tm.className="tm";tm.textContent=fmtL(r.total_ms/1000);
    li.append(rk,nm,tm);listEl.appendChild(li);});}
async function loadRank(diff,listEl){
  if(!RANK_ON)return;listEl.innerHTML=`<div class="empty">読み込み中…</div>`;
  try{const rows=await rpc("iqa_leaderboard",{p_difficulty:diff,p_player:playerId(),p_limit:20});drawRank(listEl,rows||[]);}
  catch(e){listEl.innerHTML=`<div class="empty">ランキングを読み込めませんでした。時間をおいて開き直してください。</div>`;}}
let rankDiff="normal";
function drawRankSeg(){const el=$("rankSeg");el.innerHTML="";DIFFS.forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed",String(rankDiff===v));b.onclick=()=>{rankDiff=v;drawRankSeg();loadRank(v,$("titleRankList"));};el.appendChild(b);});}
function showTitleRank(){if(!RANK_ON)return;$("titleRank").hidden=false;rankDiff=game.diff;drawRankSeg();loadRank(rankDiff,$("titleRankList"));}
let submitted=false;
function setupSubmit(allClear){
  submitted=false;$("submitBox").hidden=!RANK_ON;$("resRank").hidden=!RANK_ON;if(!RANK_ON)return;
  $("resRankH").textContent=`ランキング（${DIFF_JA[game.diff]}）`;loadRank(game.diff,$("resRankList"));
  const st=$("submitSt"),btn=$("submitBtn"),inp=$("nickIn");inp.value=store("iqa-nick")||"";st.className="st";
  if(!allClear){inp.disabled=true;btn.disabled=true;st.textContent="パスしたステージがあるため、この記録は登録できません。";return;}
  inp.disabled=false;btn.disabled=false;st.textContent="ニックネームを入れて登録すると、ランキングに載ります。";}
$("submitBtn").onclick=async()=>{
  if(submitted)return;const inp=$("nickIn"),st=$("submitSt"),btn=$("submitBtn"),nick=inp.value.trim();
  if(!nick||nick.length>12){st.textContent=SUBMIT_ERR.nickname_length;st.className="st ng";inp.focus();return;}
  btn.disabled=true;st.textContent="登録中…";st.className="st";
  try{const r=await rpc("iqa_submit_score",{p_player:playerId(),p_nickname:nick,p_difficulty:game.diff,
      p_stage_ms:game.results.map(x=>Math.round(x.time*1000)),p_code:codeOf()});
    submitted=true;store("iqa-nick",nick);inp.disabled=true;
    const beat=r.best_ms===r.total_ms;
    st.textContent=`登録しました。${beat?"自己ベストで":"自己ベスト "+fmtL(r.best_ms/1000)+" で"} ${r.rank}位 / ${r.players}人中`;st.className="st ok";
    loadRank(game.diff,$("resRankList"));}
  catch(e){btn.disabled=false;st.textContent=SUBMIT_ERR[e.code]||"登録できませんでした。通信状態を確認して、もう一度押してください。";st.className="st ng";}};
$("nickIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("submitBtn").click();});
showTitleRank();
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(!$("scrIntro").hidden&&(e.key==="Enter"||e.key===" ")&&prepared){e.preventDefault();goPlay();return;}
  if(game.running&&cur)cur.onKey(e);});
</script>

</body>
